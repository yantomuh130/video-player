<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Video Player</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 76px 12px 90px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      text-align: center;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 10px;
    }

    #status {
      margin-top: 12px;
      color: #ddd;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .floating-ad {
      position: fixed;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #fff;
      color: #222;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0006;
    }

    .floating-ad.top { top: 10px; }
    .floating-ad.bottom { bottom: 10px; }

    .ad-label {
      flex-shrink: 0;
      color: #777;
      font-size: 10px;
      font-weight: bold;
    }

    .ad-link {
      flex: 1;
      color: #ee4d2d;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .close-ad {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: #555;
      font-size: 22px;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <section id="adTop" class="floating-ad top" aria-label="Sponsor">
    <span class="ad-label">SPONSOR</span>
    <a
      class="ad-link"
      href="https://shopee.co.id/"
      target="_blank"
      rel="sponsored noopener noreferrer"
    >Kunjungi Shopee</a>
    <button class="close-ad" type="button" aria-label="Tutup sponsor">×</button>
  </section>

  <main class="container">
    <h1>Video Player</h1>

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
      referrerpolicy="no-referrer"
    >
      Browser kamu tidak mendukung pemutar video.
    </video>

    <p id="status" role="status">Memuat video...</p>
  </main>

  <section id="adBottom" class="floating-ad bottom" aria-label="Sponsor Shopee">
    <span class="ad-label">SHOPEE</span>
    <a
      id="bottomLink"
      class="ad-link"
      href="#"
      target="_blank"
      rel="sponsored noopener noreferrer"
    >Lihat penawaran di Shopee</a>
    <button class="close-ad" type="button" aria-label="Tutup sponsor">×</button>
  </section>

  <script>
    "use strict";

    const JSON_URL = "./videos.json";

    // 20 link Shopee Affiliate
    const SHOPEE_LINKS. = [
      "https://s.shopee.co.id/8pmkIOTb2o",
      "https://s.shopee.co.id/Lo9Rjiqzh",
      "https://s.shopee.co.id/3qO4KjXoGL",
      "https://s.shopee.co.id/7famtrLnpd",
      "https://s.shopee.co.id/9pfHTs0EcX",
      "https://s.shopee.co.id/6L5PJSMIYJ",
      "https://s.shopee.co.id/8AX3UqEumv",
      "https://s.shopee.co.id/6L5PJU22Fg",
      "https://s.shopee.co.id/3B8NXg2LNQ",
      "https://s.shopee.co.id/AKbY4runby",
      "https://s.shopee.co.id/8AX3Uthbkb",
      "https://s.shopee.co.id/W7cMop0gh",
      "https://s.shopee.co.id/113sy3V81U",
      "https://s.shopee.co.id/7VHMi1AW5K",
      "https://s.shopee.co.id/8KqThYp4CF",
      "https://s.shopee.co.id/5fpiWfqUod",
      "https://s.shopee.co.id/9fLrI2IRNj",
      "https://s.shopee.co.id/9pfHUMI9s9",
      "https://s.shopee.co.id/4B0ujzOyZd",
      "https://s.shopee.co.id/qkSly8N4N"
    ];

    const video = document.getElementById("videoPlayer");
    const statusText = document.getElementById("status");
    const bottomLink = document.getElementById("bottomLink");

    // Pilih satu link affiliate secara acak saat halaman dibuka
    if (bottomLink && SHOPEE_LINKS.length > 0) {
      const randomIndex = Math.floor(Math.random() * SHOPEE_LINKS.length);
      bottomLink.href = SHOPEE_LINKS[randomIndex];
    }

    // Tombol untuk menutup banner
    document.querySelectorAll(".close-ad").forEach(function(button) {
      button.addEventListener("click", function() {
        const banner = button.closest(".floating-ad");
        if (banner) banner.classList.add("hidden");
      });
    });

    function getVideoUrl(data) {
      // Mendukung format JSON berupa array URL atau objek video
      if (Array.isArray(data)) {
        const first = data[0];

        if (typeof first === "string") return first;

        if (first && typeof first === "object") {
          return first.url  first.src  first.video  first.link  "";
        }
      }

      if (data && typeof data === "object") {
        if (typeof data.url === "string") return data.url;
        if (typeof data.src === "string") return data.src;
        if (typeof data.video === "string") return data.video;
        if (typeof data.link === "string") return data.link;

        if (Array.isArray(data.videos)) {
          return getVideoUrl(data.videos);
        }
      }

      return "";
    }

    async function loadVideo() {
      try {
        const response = await fetch(JSON_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("videos.json tidak ditemukan (HTTP " +
            response.status + ").");
        }

        const data = await response.json();
        const videoUrl = getVideoUrl(data);

        if (!videoUrl) {
          throw new Error(
            "URL video tidak ditemukan. Periksa isi videos.json."
          );
        }

        const parsedUrl = new URL(videoUrl, window.location.href);

        if (!["http:", "https:"].includes(parsedUrl.protocol)) {
          throw new Error("Format URL video tidak didukung.");
        }

        video.src = parsedUrl.href;
        video.load();

        statusText.textContent = "Video siap diputar.";
      } catch (error) {
        console.error("Gagal memuat video:", error);
        statusText.textContent =
          "Gagal memuat video: " + error.message;
      }
    }

    video.addEventListener("error", function() {
      if (video.error) {
        console.error(
          "Video error:",
          video.error.code,
          video.error.message
        );

        statusText.textContent =
          "Video tidak dapat diputar. Periksa URL, format video, " +
          "atau dukungan server sumber.";
      }
    });

    video.addEventListener("loadedmetadata", function() {
      statusText.textContent = "Video berhasil dimuat.";
    });

    loadVideo();
  </script>
</body>
</html>
