    #title {

    .player-container {

      margin: 0 auto;

    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
    }

    .floating-ad {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 450px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      background: linear-gradient(
        135deg,
        rgba(25, 25, 40, 0.98),
        rgba(65, 43, 88, 0.98)
      );
      border: 1px solid rgba(200, 180, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 1000;
    }

    .floating-ad.top {
      top: 12px;
    }

    .floating-ad.bottom {
      bottom: 12px;
    }

    .ad-label {
      flex-shrink: 0;
      background: #ffd43b;
      color: #282019;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: bold;
    }

    .ad-text {
      flex: 1;
      font-weight: bold;
    }

    .close-ad {
      flex-shrink: 0;
      padding: 4px 7px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #status {
      text-align: center;
      color: #c4b5fd;
      margin: 18px auto;
      max-width: 850px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    @media (min-width: 700px) {

        padding-bottom: 90px;
      }
    }
  </style>

    function getVideoUrl(data) {
      // Mendukung format JSON berupa array URL atau objek video
      if (Array.isArray(data)) {
        const first = data[0];

        if (typeof first === "string") return first;

        if (first && typeof first === "object") {
          return first.url  first.src  first.video  first.link  "";
        }
      }

      if (data && typeof data === "object") {
        if (typeof data.url === "string") return data.url;
        if (typeof data.src === "string") return data.src;
        if (typeof data.video === "string") return data.video;
        if (typeof data.link === "string") return data.link;

        if (Array.isArray(data.videos)) {
          return getVideoUrl(data.videos);
        }
      }

      return "";
    }

    async function loadVideo() {
      try {
        const response = await fetch(JSON_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("videos.json tidak ditemukan (HTTP " +
            response.status + ").");
        }

        const data = await response.json();
        const videoUrl = getVideoUrl(data);

        if (!videoUrl) {
          throw new Error(
            "URL video tidak ditemukan. Periksa isi videos.json."
          );
        }

        const parsedUrl = new URL(videoUrl, window.location.href);

        if (!["http:", "https:"].includes(parsedUrl.protocol)) {
          throw new Error("Format URL video tidak didukung.");
        }

        video.src = parsedUrl.href;
        video.load();

        statusText.textContent = "Video siap diputar.";
      } catch (error) {
        console.error("Gagal memuat video:", error);
        statusText.textContent =
          "Gagal memuat video: " + error.message;
      }
    }

    video.addEventListener("error", function() {
      if (video.error) {
        console.error(
          "Video error:",
          video.error.code,
          video.error.message
        );

        statusText.textContent =
          "Video tidak dapat diputar. Periksa URL, format video, " +
          "atau dukungan server sumber.";
      }
    });

    video.addEventListener("loadedmetadata", function() {
      statusText.textContent = "Video berhasil dimuat.";
    });

    loadVideo();
