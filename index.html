<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #09090f;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    #title {
      text-align: center;
      font-size: 18px;
      margin: 10px 0 16px;
    }

    .player-container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #000;
    }

    #status {
      text-align: center;
      color: #c4b5fd;
      margin: 18px auto;
      max-width: 850px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .telegram-link {
      display: block;
      text-align: center;
      color: #6686b8;
      font-size: 28px;
      text-decoration: none;
      margin: 35px auto 20px;
      font-weight: 400;
      position: relative;
      z-index: 9999;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .telegram-link:hover {
      color: #8daee5;
    }
  </style>
</head>

<body>

  <h1 id="title">Video Player</h1>

  <main class="player-container">
    <video id="videoPlayer" controls playsinline preload="metadata">
      Browser kamu tidak mendukung pemutar video.
    </video>
  </main>

  <p id="status" role="status">Memuat video...</p>

  <a
    href="https://t.me/wuikwuik"
    class="telegram-link"
    target="_blank"
    rel="noopener noreferrer">
    Cek koleksi lainnya
  </a>

  <script>

    // ==================================
    // LINK ADSTERRA
    // ==================================

    const ADSTERRA_LINK =
      "https://auctionr.org/4/082c0172cd3ad57615967c63448360ec";


    // ==================================
    // ELEMENT VIDEO
    // ==================================

    const video = document.getElementById("videoPlayer");
    const statusText = document.getElementById("status");


    // ==================================
    // ID VIDEO DARI PARAMETER ?f=
    // ==================================

    const params = new URLSearchParams(window.location.search);
    const id = params.get("f");


    // ==================================
    // STATUS REDIRECT SEKALI PER BROWSER
    // ==================================

    const STORAGE_KEY = "adsterra_redirect_sudah_tampil";

    let iklanDitampilkan = false;

    try {
      iklanDitampilkan =
        localStorage.getItem(STORAGE_KEY) === "1";
    } catch (error) {
      console.warn("LocalStorage tidak tersedia:", error);
    }


    // ==================================
    // REDIRECT ADSTERRA SETELAH 15 DETIK
    // ==================================

    video.addEventListener("timeupdate", function () {

      if (iklanDitampilkan) return;

      if (video.currentTime >= 15) {

        iklanDitampilkan = true;

        try {
          localStorage.setItem(STORAGE_KEY, "1");
        } catch (error) {
          console.warn("Gagal menyimpan status iklan:", error);
        }

        window.location.href = ADSTERRA_LINK;
      }

    });


    // ==================================
    // MEMUAT VIDEO DARI VIDEOS.JSON
    // ==================================

    async function loadVideo() {

      try {

        if (!id) {
          statusText.textContent =
            "Parameter video tidak ditemukan.";
          return;
        }

        const response = await fetch("/videos.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("videos.json tidak dapat dimuat.");
        }

        const data = await response.json();

        if (!Array.isArray(data.videos)) {
          throw new Error("Format videos.json tidak valid.");
        }

        // Cocokkan nama file dari parameter f
        const selected = data.videos.find(function (item) {
          return item.id === id ||
                 item.id === id.replace(/\.mp4$/i, "");
        });

        if (!selected || !selected.cdn) {
          statusText.textContent = "Video tidak ditemukan.";
          return;
        }

        video.addEventListener("error", function () {

          const errorCode = video.error
            ? video.error.code
            : "tidak diketahui";

          statusText.textContent =
            "Video gagal diputar (kode " + errorCode + ").";

          console.error("Video error:", video.error);

        });

        video.src = selected.cdn;
        video.load();

        video.addEventListener("loadedmetadata", function () {
          statusText.textContent = "";
        }, { once: true });

      } catch (error) {

        console.error(error);

        statusText.textContent =
          "Gagal memuat daftar video. Periksa videos.json.";

      }

    }


    // ==================================
    // JALANKAN VIDEO PLAYER
    // ==================================

    loadVideo();

  </script>

</body>
</html>
