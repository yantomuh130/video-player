<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>accimg</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  color: #171717;
  font-family: Arial, sans-serif;
}

.header {
  height: 105px;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: -1.5px;
  color: #171717;
  text-decoration: none;
}

.upload {
  background: #202333;
  color: #fff;
  padding: 18px 38px;
  border-radius: 40px;
  text-decoration: none;
  font-size: 20px;
}

.video-section {
  width: 100%;
  padding: 0 12px;
}

.player-container {
  width: 100%;
  max-width: 427px;
  margin: 0 auto;
  background: #000;
}

video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
}

.collection {
  display: block;
  width: fit-content;
  text-align: center;
  margin: 35px auto 65px;
  font-size: 25px;
  color: #5279c4;
  text-decoration: none;
}

#status {
  text-align: center;
  font-size: 14px;
  color: #777;
  margin: 15px auto;
}

.footer {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  padding: 20px;
}

/* POPUP */
.popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.72);
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.popup-box {
  position: relative;
  width: 100%;
  max-width: 430px;
  background: #191919;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 45px 25px 35px;
  text-align: center;
  color: #fff;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.popup-close {
  position: absolute;
  top: 12px;
  right: 18px;
  color: #aaa;
  font-size: 28px;
  cursor: pointer;
  background: none;
  border: none;
}

.popup-box h2 {
  font-size: 25px;
  margin: 5px 0 20px;
}

.popup-box p {
  color: #bbb;
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.popup-download {
  display: block;
  width: 100%;
  padding: 19px 10px;
  background: #ff4058;
  color: white;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

@media (max-width:480px) {
  .header {
    height: 105px;
    padding: 15px 20px;
  }

  .logo { font-size: 34px; }

  .upload {
    padding: 17px 35px;
    font-size: 19px;
  }
}
</style>
</head>

<body>

<header class="header">
  <a class="logo" href="/">accimg</a>

  <a class="upload"
     href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
     target="_blank"
     rel="sponsored noopener noreferrer">
    Upload
  </a>
</header>

<section class="video-section">
  <main class="player-container">
    <video id="videoPlayer"
           controls
           playsinline
           preload="metadata">
      Browser tidak mendukung pemutar video.
    </video>
  </main>

  <p id="status">Pilih video untuk diputar.</p>
</section>

<a class="collection"
   href="https://auctionr.org/4/082c0172cd3ad57615967c63448360ec"
   target="_blank"
   rel="sponsored noopener noreferrer">
  Cek koleksi lainnya
</a>

<footer class="footer">Accimg</footer>

<div class="popup-overlay" id="downloadPopup">
  <div class="popup-box">

    <button class="popup-close"
            id="closePopup"
            aria-label="Tutup">
      &times;
    </button>

    <h2>Video Siap Diunduh</h2>

    <p>
      Silakan klik tombol di bawah untuk melanjutkan
      dan mengunduh file video kualitas HD.
    </p>

    <button class="popup-download" id="downloadButton">
      Download Video
    </button>

  </div>
</div>

<script>
const ADSTERRA_LINK =
  "https://auctionr.org/4/082c0172cd3ad57615967c63448360ec";

const video = document.getElementById("videoPlayer");
const statusText = document.getElementById("status");
const popup = document.getElementById("downloadPopup");
const closeButton = document.getElementById("closePopup");
const downloadButton = document.getElementById("downloadButton");

let filename = null;
let selectedVideo = null;
let popupShown = false;

function setupVideo(filename, cdn) {
  const videoKey = "accimg_" + filename;
  const timeKey = videoKey + "_time";
  const popupKey = videoKey + "_popup";
  const playingKey = videoKey + "_playing";

  popupShown = sessionStorage.getItem(popupKey) === "yes";

  function saveVideoState() {
    if (Number.isFinite(video.currentTime)) {
      sessionStorage.setItem(timeKey, video.currentTime);
    }

    sessionStorage.setItem(
      playingKey,
      video.paused ? "no" : "yes"
    );
  }

  window.addEventListener("pagehide", saveVideoState);

  video.addEventListener("timeupdate", function () {
    if (!popupShown && video.currentTime >= 20) {
      popupShown = true;
      sessionStorage.setItem(popupKey, "yes");
      saveVideoState();
      video.pause();
      popup.style.display = "flex";
    }
  });

  function goToAdsterra() {
    saveVideoState();
    sessionStorage.setItem(popupKey, "yes");
    popup.style.display = "none";
    window.location.href = ADSTERRA_LINK;
  }

  closeButton.addEventListener("click", goToAdsterra);
  downloadButton.addEventListener("click", goToAdsterra);

  video.addEventListener("loadedmetadata", function () {
    statusText.textContent = "";

    const savedTime = Number(sessionStorage.getItem(timeKey) || 0);

    if (savedTime > 0 && savedTime < video.duration) {
      video.currentTime = savedTime;
    }

    if (popupShown) {
      popup.style.display = "none";
    }
  }, { once: true });

  video.addEventListener("error", function () {
    statusText.textContent = "Video gagal diputar.";
  });

  video.src = cdn;
  video.load();
}

async function loadHomepage() {
  try {
    const response = await fetch("/videos.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Gagal mengambil videos.json");
    }

    const data = await response.json();

    if (!Array.isArray(data.videos) || data.videos.length === 0) {
      throw new Error("Daftar video kosong.");
    }

    // Tampilkan video pertama sebagai video utama.
    selectedVideo = data.videos[0];

    if (!selectedVideo.cdn) {
      throw new Error("URL video tidak tersedia.");
    }

    filename = selectedVideo.id;
    setupVideo(filename, selectedVideo.cdn);

  } catch (error) {
    console.error(error);
    statusText.textContent = "Gagal memuat video.";
  }
}

loadHomepage();
</script>

</body>
</html>
