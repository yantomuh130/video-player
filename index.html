<a
  href="https://t.me/wuikwuik"
  id="telegramLink"
  class="telegram-link"
  target="_blank"
  rel="noopener noreferrer">
  Cek koleksi lainnya
</a>

<script>
  // ==================================
  // KONFIGURASI
  // ==================================
  const ADSTERRA_LINK = "https://auctionr.org/4/082c0172cd3ad57615967c63448360ec";
  const TELEGRAM_LINK = "https://t.me/wuikwuik";
  const IKLAN_DETIK = 15;
  const STORAGE_KEY = "adsterra_redirect_sudah_tampil";

  const video = document.getElementById("videoPlayer");
  const statusText = document.getElementById("status");
  const telegramLink = document.getElementById("telegramLink");

  telegramLink.href = TELEGRAM_LINK;

  // ==================================
  // HELPER STORAGE
  // ==================================
  function simpan(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function ambil(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  // ==================================
  // ID VIDEO DARI URL
  // ==================================
  const id = decodeURIComponent(window.location.pathname.replace(/^\/+/, ""));
  const POSITION_KEY = "posisi_video_" + id;

  let iklanDitampilkan = ambil(STORAGE_KEY) === "1";

  // ==================================
  // REDIRECT ADSTERRA (SEKALI SAJA)
  // ==================================
  video.addEventListener("timeupdate", function () {
    if (iklanDitampilkan) return;
    if (video.seeking) return;

    if (video.currentTime >= IKLAN_DETIK) {
      iklanDitampilkan = true;
      simpan(STORAGE_KEY, "1");

      // Simpan posisi agar video lanjut saat pengunjung kembali
      simpan(POSITION_KEY, String(video.currentTime));

      video.pause();
      window.location.href = ADSTERRA_LINK;
    }
  });

  // ==================================
  // LANJUTKAN POSISI SETELAH KEMBALI
  // ==================================
  function lanjutkanPosisi() {
    const tersimpan = parseFloat(ambil(POSITION_KEY));
    if (!isNaN(tersimpan) && tersimpan > 0) {
      video.currentTime = tersimpan;
      try { localStorage.removeItem(POSITION_KEY); } catch (e) {}
    }
  }

  // Halaman dipulihkan dari cache (tombol Back)
  window.addEventListener("pageshow", function (e) {
    if (e.persisted && video.readyState >= 1) {
      lanjutkanPosisi();
    }
  });

  // ==================================
  // MEMUAT VIDEO DARI VIDEOS.JSON
  // ==================================
  async function loadVideo() {
    try {
      if (!id) {
        statusText.textContent = "Tambahkan ID video di akhir URL.";
        return;
      }

      const response = await fetch("videos.json", { cache: "no-store" });
      if (!response.ok) throw new Error("videos.json tidak dapat dimuat.");

      const data = await response.json();
      if (!Array.isArray(data.videos)) {
        throw new Error("Format videos.json tidak valid.");
      }

      const selected = data.videos.find(function (item) {
        return item.id === id;
      });

      if (!selected || !selected.cdn) {
        statusText.textContent = "Video tidak ditemukan.";
        return;
      }

      video.addEventListener("error", function () {
        const code = video.error ? video.error.code : "tidak diketahui";
        statusText.textContent = "Video gagal diputar (kode " + code + ").";
        console.error("Video error:", video.error);
      });

      video.addEventListener("loadedmetadata", function () {
        statusText.textContent = "";
        lanjutkanPosisi();
      }, { once: true });

      video.src = selected.cdn;
      video.load();

    } catch (error) {
      console.error(error);
      statusText.textContent = "Gagal memuat daftar video. Periksa videos.json.";
    }
  }

  loadVideo();
</script>
